name: ??? Saturday Implementation Plan (Every Saturday 8AM IST)

on:
  schedule:
    - cron: "30 2 * * 6"   # 2:30 AM UTC = 8:00 AM IST every Saturday
  workflow_dispatch:

jobs:
  send_saturday_plan:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Saturday Implementation Plan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: "vishnuzanwar90@gmail.com"
        run: |
          python << 'PYTHON_SCRIPT'
          import os, json, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime

          # Status is computed by actually checking the filesystem below,
          # not hardcoded — a previous version of this list hardcoded
          # "DONE" for items whose files didn't exist yet.
          def file_exists(path):
              return os.path.isfile(path)

          def file_contains(path, needle):
              if not file_exists(path):
                  return False
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  return needle in f.read()

          blockers = [
            {
              "id": 1, "title": "PINCODE Collision Registry",
              "description": "pincode_registry.json prevents duplicate PINCODE assignments.",
              "test_command": ".\\brain.ps1 check-pincode LWE001",
              "done_if": file_exists("00_SYSTEM/pincode_registry.json")
            },
            {
              "id": 2, "title": "Branch Write Lock",
              "description": "All agents write to main only. Domain branches are read-only.",
              "test_command": "cat .github/BRANCH_PROTECTION.md",
              "done_if": file_exists(".github/BRANCH_PROTECTION.md")
            },
            {
              "id": 3, "title": "Model Fallback Chain",
              "description": "model_config.json routes tasks across Groq, OpenRouter, Ollama.",
              "test_command": "cat 00_SYSTEM/model_config.json",
              "done_if": file_exists("00_SYSTEM/model_config.json")
            },
            {
              "id": 4, "title": "PINCODE Search Index",
              "description": "pincode_index.json + brain.ps1 search/reindex for fast keyword search across all notes.",
              "steps": [
                "Review current pincode_index.json structure",
                "Add brain.ps1 search [keyword] command that queries the index",
                "Test: .\\brain.ps1 search wire",
                "Commit and push to GitHub"
              ],
              "estimated_time": "45 minutes",
              "difficulty": "Beginner",
              "learning_outcome": "You will learn JSON file manipulation in PowerShell and fast keyword indexing",
              "done_if": file_exists("00_SYSTEM/pincode_index.json") and file_contains("brain.ps1", '"search"')
            },
            {
              "id": 5, "title": "Staleness Sweep Automation",
              "description": "Quarterly staleness check flagging notes with a stale or missing 'Last Verified' date.",
              "estimated_time": "30 minutes",
              "difficulty": "Beginner",
              "done_if": file_exists("00_SYSTEM/staleness_check.ps1")
            },
            {
              "id": 6, "title": "RAG Layer (Vector Search)",
              "description": "ChromaDB + sentence-transformers for semantic search across all PINCODE files.",
              "estimated_time": "2 hours",
              "difficulty": "Intermediate",
              "done_if": file_exists("00_SYSTEM/vector_index") or file_contains("requirements.txt", "sentence-transformers")
            }
          ]

          for b in blockers:
              b["status"] = "DONE" if b["done_if"] else "TODO"

          next_blocker = next((b for b in blockers if b["status"] == "TODO"), None)
          today = datetime.now().strftime("%B %d, %Y")

          done_html = "".join(
            f'<li style="color:#10b981;">? #{b["id"]} � {b["title"]}</li>'
            for b in blockers if b["status"] == "DONE"
          )

          if next_blocker:
            steps_html = "".join(
              f'<li style="padding:8px 0;">Step {i+1}: {s}</li>'
              for i, s in enumerate(next_blocker.get("steps", []))
            )
            plan_html = f"""
            <div style="background:#1e1e38;color:#e2e8f0;padding:24px;border-radius:12px;margin:16px 0;">
              <h3 style="color:#a855f7;margin-top:0;">
                ?? Today's Build: #{next_blocker["id"]} � {next_blocker["title"]}
              </h3>
              <p style="color:#94a3b8;">{next_blocker["description"]}</p>
              <table style="width:100%;margin:16px 0;">
                <tr>
                  <td style="color:#64748b;">?? Estimated Time</td>
                  <td style="color:#f1f5f9;font-weight:bold;">{next_blocker.get("estimated_time","TBD")}</td>
                </tr>
                <tr>
                  <td style="color:#64748b;">?? Difficulty</td>
                  <td style="color:#f1f5f9;font-weight:bold;">{next_blocker.get("difficulty","TBD")}</td>
                </tr>
                <tr>
                  <td style="color:#64748b;">?? What You Learn</td>
                  <td style="color:#f1f5f9;font-weight:bold;">{next_blocker.get("learning_outcome","New engineering skill")}</td>
                </tr>
              </table>
              <h4 style="color:#6366f1;">?? Step-by-Step Plan:</h4>
              <ol style="color:#e2e8f0;line-height:2;">{steps_html}</ol>
              <div style="background:#0f172a;padding:16px;border-radius:8px;margin-top:16px;">
                <p style="color:#64748b;margin:0 0 8px;">Open Antigravity IDE and start with:</p>
                <code style="color:#a855f7;font-size:15px;">@salesforce-brain Saturday session � let us build blocker #{next_blocker["id"]}: {next_blocker["title"]}</code>
              </div>
            </div>
            """
          else:
            plan_html = "<p style='color:#10b981;font-weight:bold;'>?? All blockers solved! Time to add new features.</p>"

          html = f"""
          <html><body style="font-family:Arial,sans-serif;max-width:680px;margin:auto;color:#1e1e2e;">

          <div style="background:linear-gradient(135deg,#1e1e38,#0f172a);padding:32px;border-radius:12px;">
            <h1 style="color:#a855f7;margin:0;">??? Saturday Build Session</h1>
            <p style="color:#94a3b8;margin:8px 0 0;">{today} &nbsp;|&nbsp; H-AKOS Implementation Plan</p>
          </div>

          <div style="padding:24px 0;">

            <h2 style="color:#10b981;">? Completed So Far</h2>
            <ul style="background:#ecfdf5;padding:16px 32px;border-radius:8px;border-left:4px solid #10b981;">
              {done_html}
            </ul>

            <h2 style="color:#a855f7;">?? This Saturday's Implementation</h2>
            {plan_html}

            <h2 style="color:#f59e0b;">?? Learn While You Build</h2>
            <div style="background:#fffbeb;padding:20px;border-radius:8px;border-left:4px solid #f59e0b;">
              <p><strong>Before you start:</strong> Ask the agent to teach you the concept first, then build.</p>
              <code style="color:#92400e;">@salesforce-brain Explain JSON indexing and keyword search in PowerShell before we build the search feature</code>
            </div>

          </div>

          <div style="background:#f1f5f9;padding:16px;border-radius:8px;text-align:center;color:#64748b;font-size:12px;">
            Auto-generated by H-AKOS GitHub Actions &nbsp;|&nbsp;
            <a href="https://github.com/Vishnu-Zanwar/salesforce-agent-brain">View Repository</a>
          </div>

          </body></html>
          """

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"??? Saturday Build Plan � {today}"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["RECIPIENT_EMAIL"]
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail(os.environ["GMAIL_USER"], os.environ["RECIPIENT_EMAIL"], msg.as_string())

          print("? Saturday plan sent successfully!")
          PYTHON_SCRIPT
