name: 🛠️ Saturday Implementation Plan (Every Saturday 8AM IST)

on:
  schedule:
    - cron: "30 2 * * 6"   # 2:30 AM UTC = 8:00 AM IST every Saturday
  workflow_dispatch:

jobs:
  send_saturday_plan:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Saturday Implementation Plan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: "vishnuzanwar90@gmail.com"
        run: |
          python << 'PYTHON_SCRIPT'
          import os, json, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime

          # Status is computed by actually checking the filesystem below,
          # not hardcoded — a previous version of this list hardcoded
          # "DONE" for items whose files didn't exist yet.
          def file_exists(path):
              return os.path.isfile(path)

          def file_contains(path, needle):
              if not file_exists(path):
                  return False
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  return needle in f.read()

          blockers = [
            {
              "id": 1, "title": "PINCODE Collision Registry",
              "description": "pincode_registry.json prevents duplicate PINCODE assignments.",
              "test_command": ".\\brain.ps1 check-pincode LWE001",
              "done_if": file_exists("00_SYSTEM/pincode_registry.json")
            },
            {
              "id": 2, "title": "Branch Write Lock",
              "description": "All agents write to main only. Domain branches are read-only.",
              "test_command": "cat .github/BRANCH_PROTECTION.md",
              "done_if": file_exists(".github/BRANCH_PROTECTION.md")
            },
            {
              "id": 3, "title": "Model Fallback Chain",
              "description": "model_config.json routes tasks across Groq, OpenRouter, Ollama.",
              "test_command": "cat 00_SYSTEM/model_config.json",
              "done_if": file_exists("00_SYSTEM/model_config.json")
            },
            {
              "id": 4, "title": "PINCODE Search Index",
              "description": "pincode_index.json + brain.ps1 search/reindex for fast keyword search across all notes.",
              "steps": [
                "Review current pincode_index.json structure",
                "Add brain.ps1 search [keyword] command that queries the index",
                "Test: .\\brain.ps1 search wire",
                "Commit and push to GitHub"
              ],
              "estimated_time": "45 minutes",
              "difficulty": "Beginner",
              "learning_outcome": "You will learn JSON file manipulation in PowerShell and fast keyword indexing",
              "done_if": file_exists("00_SYSTEM/pincode_index.json") and file_contains("brain.ps1", '"search"')
            },
            {
              "id": 5, "title": "Staleness Sweep Automation",
              "description": "Quarterly staleness check flagging notes with a stale or missing 'Last Verified' date.",
              "estimated_time": "30 minutes",
              "difficulty": "Beginner",
              "done_if": file_exists("00_SYSTEM/staleness_check.ps1")
            },
            {
              "id": 6, "title": "RAG Layer (Vector Search)",
              "description": "ChromaDB + sentence-transformers for semantic search across all PINCODE files.",
              "estimated_time": "2 hours",
              "difficulty": "Intermediate",
              "done_if": file_exists("00_SYSTEM/vector_index") or file_contains("requirements.txt", "sentence-transformers")
            }
          ]

          for b in blockers:
              b["status"] = "DONE" if b["done_if"] else "TODO"

          next_blocker = next((b for b in blockers if b["status"] == "TODO"), None)
          today = datetime.now().strftime("%B %d, %Y")
          done_count = sum(1 for b in blockers if b["status"] == "DONE")
          total_count = len(blockers)

          FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"

          done_html = "".join(
            f'<div style="padding:6px 0;font-family:{FONT};font-size:14px;color:#065f46;">'
            f'<span style="display:inline-block;background:#10b981;color:#ffffff;font-size:10px;font-weight:700;'
            f'border-radius:4px;padding:2px 6px;margin-right:8px;">DONE</span>'
            f'#{b["id"]} &mdash; {b["title"]}</div>'
            for b in blockers if b["status"] == "DONE"
          ) or f'<div style="font-family:{FONT};font-size:14px;color:#64748b;">Nothing marked done yet.</div>'

          if next_blocker:
            steps_html = "".join(
              f'<li style="padding:6px 0;">{s}</li>'
              for s in next_blocker.get("steps", [])
            ) or '<li style="padding:6px 0;color:#94a3b8;">No step-by-step breakdown written yet for this one.</li>'
            plan_html = f"""
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="background:linear-gradient(135deg,#1e1b4b,#0f172a);border-radius:14px;">
              <tr><td style="padding:26px 28px;">
                <p style="margin:0 0 4px 0;font-family:{FONT};font-size:12px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:1px;">Today's Build</p>
                <h3 style="margin:0 0 12px 0;font-family:{FONT};font-size:19px;color:#ffffff;">#{next_blocker["id"]} &mdash; {next_blocker["title"]}</h3>
                <p style="margin:0 0 18px 0;font-family:{FONT};font-size:14px;color:#c7d2fe;">{next_blocker["description"]}</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 18px 0;">
                  <tr>
                    <td style="padding:4px 20px 4px 0;font-family:{FONT};font-size:12px;color:#818cf8;">⏱ Est. Time</td>
                    <td style="padding:4px 0;font-family:{FONT};font-size:13px;font-weight:700;color:#f1f5f9;">{next_blocker.get("estimated_time","TBD")}</td>
                  </tr>
                  <tr>
                    <td style="padding:4px 20px 4px 0;font-family:{FONT};font-size:12px;color:#818cf8;">🎚 Difficulty</td>
                    <td style="padding:4px 0;font-family:{FONT};font-size:13px;font-weight:700;color:#f1f5f9;">{next_blocker.get("difficulty","TBD")}</td>
                  </tr>
                  <tr>
                    <td style="padding:4px 20px 4px 0;font-family:{FONT};font-size:12px;color:#818cf8;vertical-align:top;">🎓 You'll Learn</td>
                    <td style="padding:4px 0;font-family:{FONT};font-size:13px;font-weight:700;color:#f1f5f9;">{next_blocker.get("learning_outcome","New engineering skill")}</td>
                  </tr>
                </table>
                <p style="margin:0 0 8px 0;font-family:{FONT};font-size:12px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:1px;">Step-by-step</p>
                <ol style="margin:0 0 18px 0;padding-left:20px;font-family:{FONT};font-size:14px;color:#e2e8f0;line-height:1.6;">{steps_html}</ol>
                <div style="background:#0f172a;border:1px solid #312e81;border-radius:8px;padding:14px 16px;">
                  <p style="margin:0 0 6px 0;font-family:{FONT};font-size:11px;color:#818cf8;">Open your IDE's AI chat and start with:</p>
                  <code style="color:#c4b5fd;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;">@salesforce-brain Saturday session &mdash; let's build blocker #{next_blocker["id"]}: {next_blocker["title"]}</code>
                </div>
              </td></tr>
            </table>
            """
          else:
            plan_html = f"""
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:14px;">
              <tr><td style="padding:24px 28px;text-align:center;">
                <p style="margin:0;font-family:{FONT};font-size:15px;font-weight:700;color:#047857;">🎉 All tracked blockers are DONE. Time to scope new ones.</p>
              </td></tr>
            </table>
            """

          html = f"""
          <html>
          <body style="margin:0;padding:0;background:#eef1f6;font-family:{FONT};">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6;padding:32px 16px;">
          <tr><td align="center">
          <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:640px;max-width:100%;">

            <!-- HEADER -->
            <tr><td style="background:linear-gradient(135deg,#312e81,#0f172a);border-radius:18px 18px 0 0;padding:36px 32px;">
              <p style="margin:0;font-family:{FONT};font-size:12px;font-weight:700;letter-spacing:1.5px;color:#a5b4fc;text-transform:uppercase;">H-AKOS &middot; Implementation Plan</p>
              <h1 style="margin:8px 0 0 0;font-family:{FONT};font-size:26px;color:#ffffff;">🛠️ Saturday Build Session</h1>
              <p style="margin:10px 0 0 0;font-family:{FONT};font-size:14px;color:#94a3b8;">{today} &nbsp;&bull;&nbsp; {done_count}/{total_count} blockers verified done</p>
            </td></tr>

            <!-- BODY -->
            <tr><td style="background:#eef1f6;padding:20px 0 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

              <!-- COMPLETED -->
              <tr><td style="padding:0 0 16px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;">
                  <tr><td style="height:4px;background:#10b981;line-height:4px;font-size:0;">&nbsp;</td></tr>
                  <tr><td style="padding:20px 24px;">
                    <p style="margin:0 0 12px 0;font-family:{FONT};font-size:15px;font-weight:700;color:#0f172a;">✅ Verified Done ({done_count}/{total_count})</p>
                    {done_html}
                  </td></tr>
                </table>
              </td></tr>

              <!-- TODAY'S PLAN -->
              <tr><td style="padding:0 0 16px 0;">
                {plan_html}
              </td></tr>

              <!-- LEARN WHILE YOU BUILD -->
              <tr><td style="padding:0 0 4px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background:#fffbeb;border:1px solid #fde68a;border-radius:14px;">
                  <tr><td style="padding:18px 22px;">
                    <p style="margin:0 0 8px 0;font-family:{FONT};font-size:14px;font-weight:700;color:#92400e;">📚 Learn While You Build</p>
                    <p style="margin:0 0 10px 0;font-family:{FONT};font-size:13px;color:#78350f;">Before you start: ask the agent to teach you the concept first, then build.</p>
                    <code style="display:block;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:10px 12px;color:#9a3412;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;">@salesforce-brain Explain JSON indexing and keyword search in PowerShell before we build the search feature</code>
                  </td></tr>
                </table>
              </td></tr>

            </table>
            </td></tr>

            <!-- FOOTER -->
            <tr><td style="padding:20px 8px;text-align:center;">
              <p style="margin:0;font-family:{FONT};font-size:12px;color:#94a3b8;">
                Auto-generated by H-AKOS GitHub Actions &nbsp;&bull;&nbsp;
                <a href="https://github.com/Vishnu-Zanwar/salesforce-agent-brain" style="color:#6366f1;text-decoration:none;font-weight:600;">View Repository</a>
              </p>
            </td></tr>

          </table>
          </td></tr>
          </table>
          </body>
          </html>
          """

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"🛠️ Saturday Build Plan — {today}"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["RECIPIENT_EMAIL"]
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail(os.environ["GMAIL_USER"], os.environ["RECIPIENT_EMAIL"], msg.as_string())

          print("Saturday plan sent successfully!")
          PYTHON_SCRIPT
