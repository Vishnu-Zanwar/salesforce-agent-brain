name: 🧠 Weekly Brain Digest (Every Friday 7PM IST)

on:
  schedule:
    - cron: "30 13 * * 5"
  workflow_dispatch:

jobs:
  send_weekly_digest:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests feedparser

      - name: Generate and Send Weekly Digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: "vishnuzanwar90@gmail.com"
        run: |
          python << 'PYTHON_SCRIPT'
          import os, json, smtplib, subprocess, time
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime
          import requests, feedparser

          def safe_fetch_rss(url, max_items=4):
              try:
                  feed = feedparser.parse(url)
                  items = feed.entries[:max_items]
                  return [{"title": e.get("title","No title"), "link": e.get("link","#"), "summary": e.get("summary","")} for e in items]
              except:
                  return []

          def safe_fetch_json(url, headers=None, timeout=8):
              try:
                  r = requests.get(url, headers=headers or {}, timeout=timeout)
                  return r.json()
              except:
                  return {}

          def items_to_html(items, color):
              if not items:
                  return f'<li style="color:#94a3b8;">No updates found this week</li>'
              return "".join(
                  f'<li style="padding:6px 0;"><a href="{i["link"]}" style="color:{color};text-decoration:none;font-weight:bold;">{i["title"]}</a></li>'
                  for i in items
              )

          print("Fetching web intelligence sources...")

          # -- SOURCE 1: Salesforce Developer Blog -----------------------
          sf_dev_blog = safe_fetch_rss("https://developer.salesforce.com/blogs/feed")
          print(f"[ok] Salesforce Dev Blog: {len(sf_dev_blog)} items")

          # -- SOURCE 2: Salesforce Release Notes ------------------------
          sf_release = safe_fetch_rss("https://help.salesforce.com/s/rss_feed?language=en_US")
          print(f"[ok] Salesforce Release Notes: {len(sf_release)} items")

          # -- SOURCE 3: Dev.to Salesforce Articles ----------------------
          devto_raw = safe_fetch_json("https://dev.to/api/articles?tag=salesforce&per_page=4&top=7")
          devto = [{"title": a.get("title",""), "link": a.get("url","#")} for a in (devto_raw if isinstance(devto_raw, list) else [])]
          print(f"[ok] Dev.to Salesforce: {len(devto)} articles")

          # -- SOURCE 4: Reddit r/salesforce -----------------------------
          reddit_raw = safe_fetch_json(
              "https://www.reddit.com/r/salesforce/top.json?limit=4&t=week",
              headers={"User-Agent": "salesforce-brain-bot/1.0"}
          )
          reddit_posts = []
          try:
              for post in reddit_raw.get("data", {}).get("children", []):
                  d = post.get("data", {})
                  reddit_posts.append({"title": d.get("title",""), "link": f'https://reddit.com{d.get("permalink","")}'})
          except:
              pass
          print(f"[ok] Reddit r/salesforce: {len(reddit_posts)} posts")

          # -- SOURCE 5: npm @salesforce packages ------------------------
          npm_raw = safe_fetch_json("https://registry.npmjs.org/-/v1/search?text=@salesforce&size=4")
          npm_packages = []
          try:
              for pkg in npm_raw.get("objects", []):
                  p = pkg.get("package", {})
                  npm_packages.append({
                      "title": f'{p.get("name","")} v{p.get("version","")} - {p.get("description","")}',
                      "link": f'https://npmjs.com/package/{p.get("name","")}'
                  })
          except:
              pass
          print(f"[ok] npm @salesforce: {len(npm_packages)} packages")

          # -- SOURCE 6: GitHub Trending Salesforce ----------------------
          gh_raw = safe_fetch_json(
              "https://api.github.com/search/repositories?q=salesforce+lwc+apex&sort=updated&order=desc&per_page=4",
              headers={"Accept": "application/vnd.github+json"}
          )
          gh_repos = []
          try:
              for r in gh_raw.get("items", []):
                  gh_repos.append({
                      "title": f'⭐ {r["stargazers_count"]} - {r["full_name"]}: {r.get("description","")[:60]}',
                      "link": r["html_url"]
                  })
          except:
              pass
          print(f"[ok] GitHub Trending: {len(gh_repos)} repos")

          # -- Repo Stats -------------------------------------------------
          def count_files(folder, ext):
              result = subprocess.run(["find", folder, "-name", f"*.{ext}"], capture_output=True, text=True)
              return len([l for l in result.stdout.strip().split("\n") if l])

          commits_raw = subprocess.run(
              ["git", "log", "--oneline", "--since=7 days ago"],
              capture_output=True, text=True
          ).stdout.strip()
          commits_list = [c for c in commits_raw.split("\n") if c]
          commits_html = "<br>".join(commits_list) or '<span style="color:#94a3b8;">No commits this week</span>'

          try:
              with open("00_SYSTEM/pincode_registry.json") as f:
                  reg = json.load(f)
              total_pincodes = sum(v["last_id"] for v in reg["registry"].values())
          except:
              total_pincodes = 0

          week_end = datetime.now().strftime("%B %d, %Y")

          # -- Compose HTML Email -----------------------------------------
          FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"

          def source_card(icon, title, accent, items):
              return f"""
              <tr><td style="padding:0 0 16px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;">
                  <tr><td style="height:4px;background:{accent};line-height:4px;font-size:0;">&nbsp;</td></tr>
                  <tr><td style="padding:20px 24px;">
                    <p style="margin:0 0 12px 0;font-family:{FONT};font-size:15px;font-weight:700;color:#0f172a;">
                      {icon}&nbsp; {title}
                    </p>
                    <div style="font-family:{FONT};font-size:14px;line-height:1.9;color:#334155;">
                      {items}
                    </div>
                  </td></tr>
                </table>
              </td></tr>
              """

          def links_html(items, color):
              if not items:
                  return '<span style="color:#94a3b8;">No updates found this week.</span>'
              rows = "".join(
                  f'<div style="padding:3px 0;">'
                  f'<span style="color:{color};">&#8226;</span> '
                  f'<a href="{i["link"]}" style="color:#1e293b;text-decoration:none;font-weight:600;">{i["title"]}</a>'
                  f'</div>'
                  for i in items
              )
              return rows

          html = f"""
          <html>
          <body style="margin:0;padding:0;background:#eef1f6;font-family:{FONT};">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6;padding:32px 16px;">
          <tr><td align="center">
          <table role="presentation" width="680" cellpadding="0" cellspacing="0" style="width:680px;max-width:100%;">

            <!-- HEADER -->
            <tr><td style="background:linear-gradient(135deg,#312e81,#0f172a);border-radius:18px 18px 0 0;padding:40px 32px;">
              <p style="margin:0;font-family:{FONT};font-size:12px;font-weight:700;letter-spacing:1.5px;color:#a5b4fc;text-transform:uppercase;">H-AKOS &middot; Learning OS</p>
              <h1 style="margin:8px 0 0 0;font-family:{FONT};font-size:26px;color:#ffffff;">🧠 Weekly Brain Digest</h1>
              <p style="margin:10px 0 0 0;font-family:{FONT};font-size:14px;color:#94a3b8;">Week ending {week_end} &nbsp;&bull;&nbsp; auto-generated every Friday</p>
            </td></tr>

            <!-- BODY -->
            <tr><td style="background:#eef1f6;padding:20px 0 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

              <!-- REPO HEALTH -->
              <tr><td style="padding:0 0 16px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;">
                  <tr><td style="height:4px;background:#6366f1;line-height:4px;font-size:0;">&nbsp;</td></tr>
                  <tr><td style="padding:20px 24px;">
                    <p style="margin:0 0 14px 0;font-family:{FONT};font-size:15px;font-weight:700;color:#0f172a;">📊&nbsp; Repository Health</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td width="50%" style="background:#f5f5ff;border-radius:10px;padding:14px 16px;">
                          <p style="margin:0;font-family:{FONT};font-size:12px;color:#64748b;">Total PINcodes</p>
                          <p style="margin:2px 0 0 0;font-family:{FONT};font-size:24px;font-weight:800;color:#6366f1;">{total_pincodes}</p>
                        </td>
                        <td width="12"></td>
                        <td width="50%" style="background:#f5f5ff;border-radius:10px;padding:14px 16px;">
                          <p style="margin:0;font-family:{FONT};font-size:12px;color:#64748b;">Commits This Week</p>
                          <p style="margin:2px 0 0 0;font-family:{FONT};font-size:24px;font-weight:800;color:#6366f1;">{len(commits_list)}</p>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:18px 0 6px 0;font-family:{FONT};font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;">This week's commits</p>
                    <div style="background:#f8fafc;border-radius:8px;padding:12px 16px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;color:#475569;line-height:1.8;">
                      {commits_html}
                    </div>
                  </td></tr>
                </table>
              </td></tr>

              {source_card("📰", "Salesforce Developer Blog", "#0ea5e9", links_html(sf_dev_blog, "#0ea5e9"))}
              {source_card("⚡", "Salesforce Release Notes", "#f59e0b", links_html(sf_release, "#f59e0b"))}
              {source_card("💬", "Dev.to Community Articles", "#6366f1", links_html(devto, "#6366f1"))}
              {source_card("🔥", "Reddit r/salesforce &mdash; Top This Week", "#ef4444", links_html(reddit_posts, "#ef4444"))}
              {source_card("📦", "npm @salesforce Package Updates", "#10b981", links_html(npm_packages, "#10b981"))}
              {source_card("🌟", "GitHub Trending &mdash; Salesforce Ecosystem", "#a855f7", links_html(gh_repos, "#a855f7"))}

            </table>
            </td></tr>

            <!-- CTA -->
            <tr><td style="background:linear-gradient(135deg,#1e1b4b,#0f172a);border-radius:14px;padding:26px 28px;">
              <p style="margin:0 0 6px 0;font-family:{FONT};font-size:16px;font-weight:700;color:#c4b5fd;">🛠️ Tomorrow is Saturday Build Day</p>
              <p style="margin:0 0 14px 0;font-family:{FONT};font-size:13px;color:#94a3b8;">Open your IDE's AI chat and type:</p>
              <div style="background:#0f172a;border:1px solid #312e81;border-radius:8px;padding:14px 16px;">
                <code style="color:#c4b5fd;font-family:'SFMono-Regular',Consolas,monospace;font-size:13.5px;">@salesforce-brain Saturday planning session &mdash; what are we building today?</code>
              </div>
            </td></tr>

            <!-- FOOTER -->
            <tr><td style="padding:20px 8px;text-align:center;">
              <p style="margin:0;font-family:{FONT};font-size:12px;color:#94a3b8;">
                Auto-generated by H-AKOS GitHub Actions &nbsp;&bull;&nbsp;
                <a href="https://github.com/Vishnu-Zanwar/salesforce-agent-brain" style="color:#6366f1;text-decoration:none;font-weight:600;">View Repository</a>
              </p>
            </td></tr>

          </table>
          </td></tr>
          </table>
          </body>
          </html>
          """

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"🧠 Weekly Brain Digest — {week_end}"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["RECIPIENT_EMAIL"]
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail(os.environ["GMAIL_USER"], os.environ["RECIPIENT_EMAIL"], msg.as_string())

          print("Weekly digest sent with 6 web intelligence sources!")
          PYTHON_SCRIPT
