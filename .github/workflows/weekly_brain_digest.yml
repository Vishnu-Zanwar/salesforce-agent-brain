name: ?? Weekly Brain Digest (Every Friday 7PM IST)

on:
  schedule:
    - cron: "30 13 * * 5"   # 1:30 PM UTC = 7:00 PM IST every Friday
  workflow_dispatch:          # Allow manual trigger anytime

jobs:
  send_weekly_digest:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests feedparser

      - name: Generate and Send Weekly Digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: "vishnuzanwar90@gmail.com"
        run: |
          python << 'PYTHON_SCRIPT'
          import os, json, smtplib, subprocess
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime, timedelta
          import requests, feedparser

          # -- 1. Repo Stats ----------------------------------------------
          def count_files(folder, ext):
              result = subprocess.run(
                  ["find", folder, "-name", f"*.{ext}"],
                  capture_output=True, text=True
              )
              return len([l for l in result.stdout.strip().split("\n") if l])

          errors_count  = count_files("01_SALESFORCE", "md")
          commits_raw   = subprocess.run(
              ["git", "log", "--oneline", "--since=7 days ago"],
              capture_output=True, text=True
          ).stdout.strip()
          commits_list  = [c for c in commits_raw.split("\n") if c]
          commits_count = len(commits_list)
          commits_html  = "".join(f"<li><code>{c}</code></li>" for c in commits_list) or "<li>No commits this week</li>"

          # -- 2. Pincode Registry Stats ----------------------------------
          try:
              with open("00_SYSTEM/pincode_registry.json") as f:
                  reg = json.load(f)
              total_pincodes = sum(v["last_id"] for v in reg["registry"].values())
          except:
              total_pincodes = 0

          # -- 3. Salesforce Release Notes RSS Feed -----------------------
          sf_feed  = feedparser.parse("https://help.salesforce.com/s/rss_feed?language=en_US")
          sf_items = sf_feed.entries[:3] if sf_feed.entries else []
          sf_html  = "".join(
              f'<li><a href="{e.get("link","#")}">{e.get("title","Update")}</a></li>'
              for e in sf_items
          ) or "<li>No Salesforce updates found this week</li>"

          # -- 4. GitHub Trending (LWC / Apex / Salesforce) ---------------
          try:
              gh = requests.get(
                  "https://api.github.com/search/repositories"
                  "?q=salesforce+lwc+apex&sort=updated&order=desc&per_page=3",
                  headers={"Accept": "application/vnd.github+json"},
                  timeout=10
              ).json()
              gh_items = gh.get("items", [])
              gh_html = "".join(
                  f'<li><a href="{r["html_url"]}">{r["full_name"]}</a> ? {r["stargazers_count"]}</li>'
                  for r in gh_items
              )
          except:
              gh_html = "<li>GitHub trending fetch skipped</li>"

          # -- 5. Compose HTML Email --------------------------------------
          week_end = datetime.now().strftime("%B %d, %Y")
          html = f"""
          <html><body style="font-family:Arial,sans-serif;max-width:680px;margin:auto;color:#1e1e2e;">

          <div style="background:linear-gradient(135deg,#1e1e38,#0f172a);padding:32px;border-radius:12px;">
            <h1 style="color:#6366f1;margin:0;">?? Weekly Brain Digest</h1>
            <p style="color:#94a3b8;margin:8px 0 0;">Week ending {week_end} &nbsp;|&nbsp; salesforce-agent-brain</p>
          </div>

          <div style="padding:24px 0;">

            <h2 style="color:#6366f1;">?? Repository Health This Week</h2>
            <table style="width:100%;border-collapse:collapse;">
              <tr style="background:#f1f5f9;">
                <td style="padding:12px;border:1px solid #e2e8f0;">?? Total PINCODE Notes</td>
                <td style="padding:12px;border:1px solid #e2e8f0;font-weight:bold;color:#6366f1;">{errors_count}</td>
              </tr>
              <tr>
                <td style="padding:12px;border:1px solid #e2e8f0;">??? Total PINcodes Registered</td>
                <td style="padding:12px;border:1px solid #e2e8f0;font-weight:bold;color:#6366f1;">{total_pincodes}</td>
              </tr>
              <tr style="background:#f1f5f9;">
                <td style="padding:12px;border:1px solid #e2e8f0;">?? Git Commits This Week</td>
                <td style="padding:12px;border:1px solid #e2e8f0;font-weight:bold;color:#6366f1;">{commits_count}</td>
              </tr>
            </table>

            <h2 style="color:#6366f1;">?? This Week's Commits</h2>
            <ul style="background:#f8fafc;padding:16px 32px;border-radius:8px;border-left:4px solid #6366f1;">
              {commits_html}
            </ul>

            <h2 style="color:#f59e0b;">? Salesforce Platform Updates</h2>
            <ul style="background:#fffbeb;padding:16px 32px;border-radius:8px;border-left:4px solid #f59e0b;">
              {sf_html}
            </ul>

            <h2 style="color:#10b981;">?? GitHub Trending (Salesforce Ecosystem)</h2>
            <ul style="background:#ecfdf5;padding:16px 32px;border-radius:8px;border-left:4px solid #10b981;">
              {gh_html}
            </ul>

            <h2 style="color:#6366f1;">??? Tomorrow is Saturday!</h2>
            <div style="background:#1e1e38;color:#e2e8f0;padding:20px;border-radius:8px;">
              <p>Your Saturday implementation session is ready.<br>
              Open Antigravity IDE and type:</p>
              <code style="color:#a855f7;font-size:16px;">@salesforce-brain Saturday planning session - what are we building today?</code>
            </div>

          </div>

          <div style="background:#f1f5f9;padding:16px;border-radius:8px;text-align:center;color:#64748b;font-size:12px;">
            Auto-generated by H-AKOS GitHub Actions &nbsp;|&nbsp;
            <a href="https://github.com/Vishnu-Zanwar/salesforce-agent-brain">View Repository</a>
          </div>

          </body></html>
          """

          # -- 6. Send via Gmail SMTP -------------------------------------
          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"?? Weekly Brain Digest — {week_end}"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["RECIPIENT_EMAIL"]
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail(os.environ["GMAIL_USER"], os.environ["RECIPIENT_EMAIL"], msg.as_string())

          print("? Weekly digest sent successfully!")
          PYTHON_SCRIPT
