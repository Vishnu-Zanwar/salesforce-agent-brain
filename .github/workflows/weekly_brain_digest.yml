name: 🧠 Weekly Brain Digest (Every Friday 7PM IST)

on:
  schedule:
    - cron: "30 13 * * 5"
  workflow_dispatch:

jobs:
  send_weekly_digest:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests feedparser

      - name: Generate and Send Weekly Digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: "vishnuzanwar90@gmail.com"
        run: |
          python << 'PYTHON_SCRIPT'
          import os, json, smtplib, subprocess, time
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime
          import requests, feedparser

          def safe_fetch_rss(url, max_items=4):
              try:
                  feed = feedparser.parse(url)
                  items = feed.entries[:max_items]
                  return [{"title": e.get("title","No title"), "link": e.get("link","#"), "summary": e.get("summary","")} for e in items]
              except:
                  return []

          def safe_fetch_json(url, headers=None, timeout=8):
              try:
                  r = requests.get(url, headers=headers or {}, timeout=timeout)
                  return r.json()
              except:
                  return {}

          def items_to_html(items, color):
              if not items:
                  return f'<li style="color:#94a3b8;">No updates found this week</li>'
              return "".join(
                  f'<li style="padding:6px 0;"><a href="{i["link"]}" style="color:{color};text-decoration:none;font-weight:bold;">{i["title"]}</a></li>'
                  for i in items
              )

          print("Fetching web intelligence sources...")

          # -- SOURCE 1: Salesforce Developer Blog -----------------------
          sf_dev_blog = safe_fetch_rss("https://developer.salesforce.com/blogs/feed")
          print(f"[ok] Salesforce Dev Blog: {len(sf_dev_blog)} items")

          # -- SOURCE 2: Salesforce Release Notes ------------------------
          sf_release = safe_fetch_rss("https://help.salesforce.com/s/rss_feed?language=en_US")
          print(f"[ok] Salesforce Release Notes: {len(sf_release)} items")

          # -- SOURCE 3: Dev.to Salesforce Articles ----------------------
          devto_raw = safe_fetch_json("https://dev.to/api/articles?tag=salesforce&per_page=4&top=7")
          devto = [{"title": a.get("title",""), "link": a.get("url","#")} for a in (devto_raw if isinstance(devto_raw, list) else [])]
          print(f"[ok] Dev.to Salesforce: {len(devto)} articles")

          # -- SOURCE 4: Reddit r/salesforce -----------------------------
          reddit_raw = safe_fetch_json(
              "https://www.reddit.com/r/salesforce/top.json?limit=4&t=week",
              headers={"User-Agent": "salesforce-brain-bot/1.0"}
          )
          reddit_posts = []
          try:
              for post in reddit_raw.get("data", {}).get("children", []):
                  d = post.get("data", {})
                  reddit_posts.append({"title": d.get("title",""), "link": f'https://reddit.com{d.get("permalink","")}'})
          except:
              pass
          print(f"[ok] Reddit r/salesforce: {len(reddit_posts)} posts")

          # -- SOURCE 5: npm @salesforce packages ------------------------
          npm_raw = safe_fetch_json("https://registry.npmjs.org/-/v1/search?text=@salesforce&size=4")
          npm_packages = []
          try:
              for pkg in npm_raw.get("objects", []):
                  p = pkg.get("package", {})
                  npm_packages.append({
                      "title": f'{p.get("name","")} v{p.get("version","")} - {p.get("description","")}',
                      "link": f'https://npmjs.com/package/{p.get("name","")}'
                  })
          except:
              pass
          print(f"[ok] npm @salesforce: {len(npm_packages)} packages")

          # -- SOURCE 6: GitHub Trending Salesforce ----------------------
          gh_raw = safe_fetch_json(
              "https://api.github.com/search/repositories?q=salesforce+lwc+apex&sort=updated&order=desc&per_page=4",
              headers={"Accept": "application/vnd.github+json"}
          )
          gh_repos = []
          try:
              for r in gh_raw.get("items", []):
                  gh_repos.append({
                      "title": f'⭐ {r["stargazers_count"]} - {r["full_name"]}: {r.get("description","")[:60]}',
                      "link": r["html_url"]
                  })
          except:
              pass
          print(f"[ok] GitHub Trending: {len(gh_repos)} repos")

          # -- Repo Stats -------------------------------------------------
          def count_files(folder, ext):
              result = subprocess.run(["find", folder, "-name", f"*.{ext}"], capture_output=True, text=True)
              return len([l for l in result.stdout.strip().split("\n") if l])

          commits_raw = subprocess.run(
              ["git", "log", "--oneline", "--since=7 days ago"],
              capture_output=True, text=True
          ).stdout.strip()
          commits_list = [c for c in commits_raw.split("\n") if c]
          commits_html = "<br>".join(commits_list) or '<span style="color:#94a3b8;">No commits this week</span>'

          try:
              with open("00_SYSTEM/pincode_registry.json") as f:
                  reg = json.load(f)
              total_pincodes = sum(v["last_id"] for v in reg["registry"].values())
          except:
              total_pincodes = 0

          week_end = datetime.now().strftime("%B %d, %Y")

          # -- Compose HTML Email -----------------------------------------
          # Web-safe stack only - Gmail/Outlook/Apple Mail all strip
          # <link>/@import webfonts, so hierarchy comes from weight and
          # letter-spacing on system fonts, not a novelty typeface.
          FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          MONO = "'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          INK       = "#1A1A18"
          INK_MUTED = "#6B6A62"
          BORDER    = "#E4E1D6"
          PAPER     = "#F5F3ED"
          ACCENT    = "#B2551B"
          ACCENT_SOFT = "#F1E2CE"

          def source_section(eyebrow, title, items, count):
              rows = links_html(items)
              return f"""
              <tr><td style="padding:26px 0 0 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr><td style="border-top:1px solid {BORDER};padding-top:18px;">
                    <p style="margin:0 0 2px 0;font-family:{FONT};font-size:10.5px;font-weight:700;letter-spacing:0.09em;color:{ACCENT};text-transform:uppercase;">{eyebrow}</p>
                    <p style="margin:0 0 12px 0;font-family:{FONT};font-size:15px;font-weight:600;color:{INK};">{title} <span style="font-weight:400;color:{INK_MUTED};font-size:12.5px;">({count})</span></p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      {rows}
                    </table>
                  </td></tr>
                </table>
              </td></tr>
              """

          def links_html(items):
              if not items:
                  return f'<tr><td style="padding:2px 0;font-family:{FONT};font-size:13.5px;color:{INK_MUTED};font-style:italic;">No updates found this week.</td></tr>'
              rows = ""
              for i in items:
                  rows += f"""
                  <tr><td style="padding:7px 0;border-top:1px solid {BORDER};">
                    <a href="{i['link']}" style="font-family:{FONT};font-size:13.5px;color:{INK};text-decoration:none;line-height:1.5;">{i['title']}</a>
                  </td></tr>
                  """
              return rows

          html = f"""
          <html>
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
          <body style="margin:0;padding:0;background:{PAPER};font-family:{FONT};">
          <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{total_pincodes} PINcodes on record, {len(commits_list)} commits this week &mdash; six sources checked.</div>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{PAPER};padding:36px 16px;">
          <tr><td align="center">
          <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:640px;max-width:100%;background:#ffffff;border:1px solid {BORDER};border-radius:6px;">

            <!-- MASTHEAD -->
            <tr><td style="padding:32px 36px 20px 36px;">
              <p style="margin:0;font-family:{FONT};font-size:11px;font-weight:700;letter-spacing:0.12em;color:{ACCENT};text-transform:uppercase;">H-AKOS</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:6px;">
                <tr>
                  <td>
                    <h1 style="margin:0;font-family:{FONT};font-size:22px;font-weight:600;color:{INK};letter-spacing:-0.01em;">Weekly Brain Digest</h1>
                  </td>
                  <td align="right" style="font-family:{FONT};font-size:12.5px;color:{INK_MUTED};white-space:nowrap;">Week ending<br><span style="color:{INK};font-weight:600;">{week_end}</span></td>
                </tr>
              </table>
            </td></tr>
            <tr><td style="padding:0 36px;"><div style="border-top:2px solid {INK};"></div></td></tr>

            <!-- REPO HEALTH -->
            <tr><td style="padding:22px 36px 0 36px;">
              <p style="margin:0 0 12px 0;font-family:{FONT};font-size:10.5px;font-weight:700;letter-spacing:0.09em;color:{INK_MUTED};text-transform:uppercase;">Repository health</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid {BORDER};border-radius:6px;">
                <tr>
                  <td width="50%" style="padding:16px 20px;border-right:1px solid {BORDER};">
                    <p style="margin:0;font-family:{FONT};font-size:28px;font-weight:700;color:{INK};font-variant-numeric:tabular-nums;">{total_pincodes}</p>
                    <p style="margin:2px 0 0 0;font-family:{FONT};font-size:12px;color:{INK_MUTED};">PINcodes on record</p>
                  </td>
                  <td width="50%" style="padding:16px 20px;">
                    <p style="margin:0;font-family:{FONT};font-size:28px;font-weight:700;color:{INK};font-variant-numeric:tabular-nums;">{len(commits_list)}</p>
                    <p style="margin:2px 0 0 0;font-family:{FONT};font-size:12px;color:{INK_MUTED};">commits this week</p>
                  </td>
                </tr>
              </table>
              <div style="background:{ACCENT_SOFT};border-radius:6px;padding:12px 16px;margin-top:10px;font-family:{MONO};font-size:12px;color:{INK};line-height:1.8;">
                {commits_html}
              </div>
            </td></tr>

            <!-- SOURCES -->
            <tr><td style="padding:0 36px 8px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                {source_section("Source 01", "Salesforce Developer Blog", sf_dev_blog, len(sf_dev_blog))}
                {source_section("Source 02", "Salesforce Release Notes", sf_release, len(sf_release))}
                {source_section("Source 03", "Dev.to Community Articles", devto, len(devto))}
                {source_section("Source 04", "Reddit r/salesforce &mdash; top this week", reddit_posts, len(reddit_posts))}
                {source_section("Source 05", "npm @salesforce package updates", npm_packages, len(npm_packages))}
                {source_section("Source 06", "GitHub trending &mdash; Salesforce ecosystem", gh_repos, len(gh_repos))}
              </table>
            </td></tr>

            <!-- CTA -->
            <tr><td style="padding:8px 36px 32px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-left:3px solid {ACCENT};background:{PAPER};border-radius:0 6px 6px 0;">
                <tr><td style="padding:16px 20px;">
                  <p style="margin:0 0 6px 0;font-family:{FONT};font-size:13.5px;font-weight:600;color:{INK};">Tomorrow is Saturday build day</p>
                  <p style="margin:0 0 10px 0;font-family:{FONT};font-size:12.5px;color:{INK_MUTED};">Open your IDE's AI chat and type:</p>
                  <code style="display:block;background:#ffffff;border:1px solid {BORDER};border-radius:4px;padding:9px 12px;font-family:{MONO};font-size:12px;color:{INK};">@salesforce-brain Saturday planning session &mdash; what are we building today?</code>
                </td></tr>
              </table>
            </td></tr>

            <!-- FOOTER -->
            <tr><td style="padding:18px 36px;border-top:1px solid {BORDER};">
              <p style="margin:0;font-family:{FONT};font-size:11.5px;color:{INK_MUTED};">
                Sent automatically by H-AKOS GitHub Actions, every Friday at 7:00&nbsp;PM&nbsp;IST &middot;
                <a href="https://github.com/Vishnu-Zanwar/salesforce-agent-brain" style="color:{ACCENT};text-decoration:none;font-weight:600;">salesforce-agent-brain</a>
              </p>
            </td></tr>

          </table>
          </td></tr>
          </table>
          </body>
          </html>
          """

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"Weekly Brain Digest — {week_end}"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["RECIPIENT_EMAIL"]
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail(os.environ["GMAIL_USER"], os.environ["RECIPIENT_EMAIL"], msg.as_string())

          print("Weekly digest sent with 6 web intelligence sources!")
          PYTHON_SCRIPT
